    <div class="vehicle-section-cp">
        <div class="vehicle-card-cp">
            
                <div class="vehicle-brand-logo">
                    
                        <img src="https://storage.googleapis.com/preciosa-cars-images/28713607-9a7f-4db8-bf85-ebf3ec5b53f9.png" alt="FIAT" class="brand-logo">
                    
                </div>

        </div>
    </div>

    <div class="actions-section">
        
            <!-- Caso de éxito: mostrar botones normales -->
            <a href="#"
               class="primary-button"
               onclick="checkCarAge(2000)"
               hx-target="#block-steps"
               hx-swap="innerHTML">
                Sí, continuemos
            </a>
            
            <script>
            function checkCarAge(vehicleYear) {
                const currentYear = new Date().getFullYear();
                const isOldCar = vehicleYear <= (currentYear - 20);
                
                if (isOldCar) {
                    // Redirect to old car flow
                    htmx.ajax('POST', '/embed/step5sp/infinitocredito/994b4085-999d-4301-9531-607ff61fca42?s=sesiondeprueba000000000000000000', {
                        target: '#block-steps',
                        swap: 'innerHTML'
                    });
                } else {
                    // Continue normal flow
                    htmx.ajax('GET', '/embed/partial/infinitocredito/994b4085-999d-4301-9531-607ff61fca42?s=sesiondeprueba000000000000000000&step=2_1', {
                        target: '#block-steps',
                        swap: 'innerHTML'
                    });
                    history.pushState({}, '', '/embed/infinitocredito/994b4085-999d-4301-9531-607ff61fca42?s=sesiondeprueba000000000000000000&step=2_1');
                }
            }
            </script>
            
            <a href="/embed/partial/infinitocredito/994b4085-999d-4301-9531-607ff61fca42?s=sesiondeprueba000000000000000000&step=2sp"
               class="secondary-button modify-data-button-2cp"
               hx-get="/embed/partial/infinitocredito/994b4085-999d-4301-9531-607ff61fca42?s=sesiondeprueba000000000000000000&step=2sp"
               hx-target="#block-steps"
               hx-swap="innerHTML"
               hx-push-url="/embed/infinitocredito/994b4085-999d-4301-9531-607ff61fca42?s=sesiondeprueba000000000000000000&step=2sp">
                No, necesito modificar los datos
            </a>
        
    </div>
</section>
